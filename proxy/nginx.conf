events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Rate limiting zone (10 requests per second per IP)
    limit_req_zone $binary_remote_addr zone=waf_limit:10m rate=10r/s;

    # Upstream services inside isolated Docker network
    upstream waf_backend {
        server waf_service:8000;
        keepalive 32;
    }

    upstream target_app {
        server protected_app:8001;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Enforce maximum upload size to prevent buffer overflow/DoS
        client_max_body_size 2M;

        # Error page configuration for WAF blocks
        error_page 403 /custom_403.html;
        location = /custom_403.html {
            root /etc/nginx/html;
            internal;
        }

        # WAF Subrequest Authorization Check
        location = /_waf_check {
            internal;
            proxy_pass http://waf_backend/scan;
            proxy_pass_request_body on;
            proxy_set_header Content-Type application/json;

            # Forward original request headers and IP
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Low latency timeouts for WAF inspection
            proxy_connect_timeout 150ms;
            proxy_read_timeout 250ms;
        }

        # Main ingress location protecting the web application
        location / {
            # Apply rate limiting
            limit_req zone=waf_limit burst=20 nodelay;

            # Intercept via WAF subrequest before forwarding
            auth_request /_waf_check;

            # Forward allowed requests to the isolated target application
            proxy_pass http://target_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-WAF-Enforced "true";

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
